paths:
  /plans/{id}/checkin:
    post:
      description: Increments the check-in count for a specific plan
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check in to a plan
      tags:
      - plans
  /plans/{id}/save:
    post:
      description: Increments the save count for a specific plan
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Save a plan
      tags:
      - plans
  /radar:
    get:
      description: Fetches plans within a radius and sorts by momentum score
      parameters:
      - description: Latitude
        format: float64
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude
        format: float64
        in: query
        name: lng
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_xanderhill_radar_internal_models.Plan'
            type: array
      summary: Get nearby trending plans
      tags:
      - plans
